<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>НАРБЕРА — Админ-панель</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="login-screen">
    <div class="login-card">
      <div class="login-logo">НАРБЕРА</div>
      <h2>Админ-панель</h2>
      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="admin@narbera.ru" required autocomplete="username">
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="login-password" placeholder="Пароль" required autocomplete="current-password">
        </div>
        <div id="login-error" class="error-msg" style="display:none"></div>
        <button type="submit" class="btn-primary btn-full">Войти</button>
      </form>
    </div>
  </div>

  <div id="admin-panel" style="display:none">
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">Н</div>
        <span class="sidebar-title">НАРБЕРА</span>
        <button id="sidebar-close" class="btn-icon-sm">&times;</button>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item active" data-page="dashboard">
          <span class="nav-icon">📊</span>Дашборд
        </a>
        <a class="nav-item" data-page="editor">
          <span class="nav-icon">✏️</span>Редактор сайта
        </a>
        <a class="nav-item" data-page="inquiries">
          <span class="nav-icon">📩</span>Заявки
        </a>
        <a class="nav-item nav-divider"></a>
        <a class="nav-item nav-section" data-page="s-hero">Первый экран</a>
        <a class="nav-item nav-section" data-page="s-about">О компании</a>
        <a class="nav-item nav-section" data-page="s-services">Услуги</a>
        <a class="nav-item nav-section" data-page="s-expert">Эксперт</a>
        <a class="nav-item nav-section" data-page="s-steps">Этапы</a>
        <a class="nav-item nav-section" data-page="s-why">Кому help</a>
        <a class="nav-item nav-section" data-page="s-cases">Кейсы</a>
        <a class="nav-item nav-section" data-page="s-reviews">Отзывы</a>
        <a class="nav-item nav-section" data-page="s-faq">FAQ</a>
        <a class="nav-item nav-section" data-page="s-contacts">Контакты</a>
        <a class="nav-item nav-section" data-page="s-seo">SEO</a>
        <a class="nav-item nav-section" data-page="s-settings">Общие настройки</a>
      </nav>
      <div class="sidebar-footer">
        <a class="nav-item" id="logout-btn">
          <span class="nav-icon">🚪</span>Выйти
        </a>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <button id="menu-toggle" class="btn-icon-sm">☰</button>
        <div class="topbar-title" id="topbar-title">Дашборд</div>
        <div class="topbar-actions">
          <button id="preview-btn" class="btn-outline" onclick="window.open('/','_blank')">👁 Превью сайта</button>
          <button id="save-btn" class="btn-primary" style="display:none">💾 Сохранить</button>
        </div>
      </header>
      <div id="page-content"></div>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <div id="modal-overlay" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="btn-icon-sm" id="modal-close">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-footer">
        <button class="btn-outline" id="modal-cancel">Отмена</button>
        <button class="btn-primary" id="modal-save">Сохранить</button>
      </div>
    </div>
  </div>

  <script src="/admin/js/admin.js"></script>
</body>
</html>
